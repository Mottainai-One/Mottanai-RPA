name: Operational to analytics daily load

on:
  schedule:
    # GitHub Actions cron uses UTC: 05:00 UTC is 02:00 in Sao Paulo (UTC-03).
    # The scheduled workflow reconciles and commits the operational data mart.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: operational-to-analytics-daily
  cancel-in-progress: false

jobs:
  load:
    name: Publish analytical data mart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: databricks-production
    env:
      OPERATIONAL_DB_HOST: ${{ secrets.OPERATIONAL_DB_HOST }}
      OPERATIONAL_DB_PORT: ${{ secrets.OPERATIONAL_DB_PORT }}
      OPERATIONAL_DB_NAME: ${{ secrets.OPERATIONAL_DB_NAME }}
      OPERATIONAL_DB_USER: ${{ secrets.OPERATIONAL_DB_USER }}
      OPERATIONAL_DB_PASSWORD: ${{ secrets.OPERATIONAL_DB_PASSWORD }}
      OPERATIONAL_DB_SSLMODE: require
      ANALYTICS_DB_HOST: ${{ secrets.ANALYTICS_DB_HOST }}
      ANALYTICS_DB_PORT: ${{ secrets.ANALYTICS_DB_PORT }}
      ANALYTICS_DB_NAME: ${{ secrets.ANALYTICS_DB_NAME }}
      ANALYTICS_DB_USER: ${{ secrets.ANALYTICS_DB_USER }}
      ANALYTICS_DB_PASSWORD: ${{ secrets.ANALYTICS_DB_PASSWORD }}
      ANALYTICS_DB_SSLMODE: require
      ANALYTICS_SOURCE_SCHEMA: mottainai
      ANALYTICS_TARGET_SCHEMA: mottainai_analytics

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check required database secrets
        shell: bash
        run: |
          for name in OPERATIONAL_DB_HOST OPERATIONAL_DB_PORT OPERATIONAL_DB_NAME OPERATIONAL_DB_USER OPERATIONAL_DB_PASSWORD ANALYTICS_DB_HOST ANALYTICS_DB_PORT ANALYTICS_DB_NAME ANALYTICS_DB_USER ANALYTICS_DB_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing secret::$name is not configured"
              exit 1
            fi
          done
      - name: Install dependencies
        run: pip install --requirement requirements.txt
      - name: Apply publication view migration on manual run
        if: github.event_name == 'workflow_dispatch'
        run: python -u -m analytics.migrate_publication
      - name: Reconcile and publish data mart
        run: python -u run_analytics.py
      - name: Install Databricks CLI
        if: >-
          ${{
            github.ref == 'refs/heads/main' &&
            vars.DATABRICKS_HOST != '' &&
            vars.DATABRICKS_CLIENT_ID != '' &&
            vars.DATABRICKS_JOB_ID != ''
          }}
        uses: databricks/setup-cli@main
      - name: Trigger and await Databricks medallion refresh
        if: >-
          ${{
            github.ref == 'refs/heads/main' &&
            vars.DATABRICKS_HOST != '' &&
            vars.DATABRICKS_CLIENT_ID != '' &&
            vars.DATABRICKS_JOB_ID != ''
          }}
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_JOB_ID: ${{ vars.DATABRICKS_JOB_ID }}
        run: databricks jobs run-now "$DATABRICKS_JOB_ID" --timeout 30m --output json
      - name: Explain scheduled fallback
        if: >-
          ${{
            github.ref == 'refs/heads/main' &&
            (vars.DATABRICKS_HOST == '' ||
             vars.DATABRICKS_CLIENT_ID == '' ||
             vars.DATABRICKS_JOB_ID == '')
          }}
        run: echo "::warning::Databricks OIDC variables are not configured; the independent 02:30 Sao Paulo schedule remains the fallback."
